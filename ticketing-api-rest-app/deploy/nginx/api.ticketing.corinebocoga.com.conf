# Nginx — API Ticketing (Laravel 12 + Laravel Reverb)
# Installation : copié vers /etc/nginx/sites-available/api.ticketing.corinebocoga.com
# Certbot --nginx ajoutera la config HTTPS 443 + redirect après le premier cert.

server {
    listen 80;
    listen [::]:80;

    server_name api.ticketing.corinebocoga.com;

    root /var/www/ticketing-app/ticketing-api-rest-app/public;
    index index.php;

    charset utf-8;

    # Uploads (images d'événements, photos agents, QR codes)
    client_max_body_size 20M;

    # Logs
    access_log /var/log/nginx/ticketing-api.access.log;
    error_log  /var/log/nginx/ticketing-api.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    # PHP-FPM (Laravel)
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ---------------------------------------------------------------
    # Laravel Reverb — websockets (Echo se connecte sur /app/{key})
    # Proxy vers le service systemd ticketing-reverb (127.0.0.1:8020)
    # ---------------------------------------------------------------
    location /app/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # Dossier caché interne de Reverb (scaling channel) si activé plus tard
    location /reverb {
        proxy_pass http://127.0.0.1:8020;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
