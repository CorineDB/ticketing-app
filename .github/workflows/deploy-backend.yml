name: Deploy backend (EC2)

# Déploiement automatique de l'API Laravel sur l'instance EC2.
# Secrets requis (Settings → Secrets and variables → Actions) :
#   EC2_HOST    = IP publique / Elastic IP de l'instance
#   EC2_SSH_KEY = clé privée PEM de deploy (la clé publique est sur l'EC2)
#   EC2_USER    = ubuntu (optionnel, "ubuntu" par défaut)

on:
  push:
    branches: [main]
    paths:
      - 'ticketing-api-rest-app/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Configure SSH key
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy (git pull + composer + migrate + restart)
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 \
              -i ~/.ssh/deploy_key \
              "${EC2_USER}@${EC2_HOST}" \
              "cd /var/www/ticketing-app/ticketing-api-rest-app && ./deploy.sh"

      - name: Smoke test /api/health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          set -euo pipefail
          # Attendre que les services redémarrent puis tester via localhost (DNS peut manquer encore)
          for i in $(seq 1 12); do
            if curl -fsS "http://${EC2_HOST}/api/health" | grep -q '"status"'; then
              echo "✅ API healthy"
              exit 0
            fi
            sleep 5
          done
          echo "❌ /api/health non joignable après 60s" >&2
          exit 1
